[project]
name = "determine"
version = "0.1.0"
description = "Determine — a scientific claim-verification agent: retrieve, reason, verify, score"
authors = [{ name = "Di Liu", email = "liudisy@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "langgraph>=0.2",
    "rank-bm25>=0.2.2",
    "arxiv>=2.1",           # arXiv API client (polite rate limiting built in)
    "pint>=0.24",           # unit normalization for numeric claims
    "sympy>=1.12",
    "numpy>=1.26",
    "httpx>=0.27",
    "anthropic>=0.34",      # answerer/planner family (config-swappable)
    "openai>=1.40",         # verifier family (config-swappable; must differ from answerer)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.5"]

[project.scripts]
determine = "determine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
